name: Register Student for Activity
description: Request to manually register a student for an extracurricular activity
title: "Register student for activity: [ACTIVITY NAME]"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request that a student be registered for a specific extracurricular activity in the Mergington High School activity management system.

  - type: input
    id: activity_name
    attributes:
      label: Activity Name (exact)
      description: The exact name of the activity as it appears in the system. This is case-sensitive.
      placeholder: e.g., Chess Club
    validations:
      required: true

  - type: input
    id: student_email
    attributes:
      label: Student Email Address
      description: The student's school email address (must end in @mergington.edu).
      placeholder: e.g., student@mergington.edu
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason for Manual Registration
      description: Please briefly explain why this registration is being submitted manually.
      placeholder: e.g., The student had a technical issue and could not register themselves.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: How will you verify this request has been completed correctly?
      value: |
        - [ ] The student's email appears in the participants list for the activity
        - [ ] The activity's participant count has increased by one
        - [ ] No other enrollments were affected
    validations:
      required: true
